# CI Pipeline
#
# - lint: ruff (pinned version, config in pyproject.toml [tool.ruff])
# - test: pytest on Python 3.12
#
# Runs on every push to `main`, `v*` tags, and all pull requests.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.4"

      - run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Covers modules under test: backend.metadata_extractor -> config ->
      # pydantic-settings/dateparser, backend.rate_limit -> fastapi/starlette (+httpx TestClient).
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest dateparser pydantic-settings fastapi httpx

      - run: python -m pytest tests/ -v
