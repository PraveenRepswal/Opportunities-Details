# CI Pipeline
#
# - lint: ruff (pinned version, config in pyproject.toml [tool.ruff])
# - test: pytest on Python 3.12
#
# Runs on every push to `main`, `v*` tags, and all pull requests.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3

      - run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv pip install --system --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
          uv pip install --system pytest -r requirements.txt

      - run: python -m pytest tests/ -v
